<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#0f172a}
      .s{font-size:13px;fill:#334155}
      .n{font-size:13px;font-weight:700;fill:#fff}
      .lbl{font-size:12px;fill:#475569;font-style:italic}
      .ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#ar)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#ar)}
    </style>
  </defs>

  <rect width="900" height="1180" fill="#f8fafc"/>
  <text x="450" y="48" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">24/7 Rentals &amp; Tours: Booking Flow</text>
  <text x="450" y="74" text-anchor="middle" class="s">From "Book now" to car returned · Owner: Nole Candizo</text>

  <!-- lane labels -->
  <rect x="30" y="96" width="250" height="28" rx="14" fill="#dbeafe"/><text x="155" y="115" text-anchor="middle" class="s" font-weight="700">CUSTOMER (dining room)</text>
  <rect x="325" y="96" width="250" height="28" rx="14" fill="#fef3c7"/><text x="450" y="115" text-anchor="middle" class="s" font-weight="700">SERVER (kitchen)</text>
  <rect x="620" y="96" width="250" height="28" rx="14" fill="#dcfce7"/><text x="745" y="115" text-anchor="middle" class="s" font-weight="700">OWNER (Nole)</text>

  <!-- 1 pick service -->
  <rect x="30" y="145" width="250" height="78" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="54" cy="169" r="14" fill="#3b82f6"/><text x="54" y="174" text-anchor="middle" class="n">1</text>
  <text x="76" y="174" class="t">Pick service + dates</text>
  <text x="46" y="200" class="s">Self-drive · With driver</text>
  <text x="46" y="216" class="s">6-hr Day Tour · Long-term Tour</text>

  <!-- 2 slot check -->
  <rect x="325" y="145" width="250" height="78" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="349" cy="169" r="14" fill="#f59e0b"/><text x="349" y="174" text-anchor="middle" class="n">2</text>
  <text x="371" y="174" class="t">Check slot is free</text>
  <text x="341" y="200" class="s">Overlap + 2-hr buffer + blocked</text>
  <text x="341" y="216" class="s">dates. Database refuses clashes.</text>
  <path class="ln" d="M280,184 L323,184"/>

  <!-- 3 choose unit -->
  <rect x="30" y="260" width="250" height="78" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="54" cy="284" r="14" fill="#3b82f6"/><text x="54" y="289" text-anchor="middle" class="n">3</text>
  <text x="76" y="289" class="t">Choose a unit</text>
  <text x="46" y="315" class="s">Only free units are pickable;</text>
  <text x="46" y="331" class="s">taken ones are greyed out</text>
  <path class="ln" d="M450,223 L450,240 L155,240 L155,258"/>

  <!-- 4 hold -->
  <rect x="325" y="260" width="250" height="78" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="349" cy="284" r="14" fill="#f59e0b"/><text x="349" y="289" text-anchor="middle" class="n">4</text>
  <text x="371" y="289" class="t">HOLD unit 30 min</text>
  <text x="341" y="315" class="s">Timer runs out → EXPIRED,</text>
  <text x="341" y="331" class="s">unit goes back on sale</text>
  <path class="ln" d="M280,299 L323,299"/>

  <!-- 5 details + agreement -->
  <rect x="30" y="375" width="250" height="94" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="54" cy="399" r="14" fill="#3b82f6"/><text x="54" y="404" text-anchor="middle" class="n">5</text>
  <text x="76" y="404" class="t">Details + e-sign</text>
  <text x="46" y="430" class="s">Name, +63 mobile, pickup spot,</text>
  <text x="46" y="446" class="s">license (self-drive). Type name</text>
  <text x="46" y="462" class="s">to sign Booking Agreement.</text>
  <path class="ln" d="M450,338 L450,356 L155,356 L155,373"/>

  <!-- 6 deposit choice: diamond -->
  <polygon points="155,505 270,560 155,615 40,560" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="555" text-anchor="middle" class="t">Lock it in</text>
  <text x="155" y="575" text-anchor="middle" class="s">pick one</text>
  <path class="ln" d="M155,469 L155,503"/>

  <!-- options -->
  <rect x="30" y="650" width="250" height="56" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="46" y="674" class="t" font-size="15">A · GCash via PayMongo</text>
  <text x="46" y="694" class="s">Auto-confirmed (webhook)</text>

  <rect x="30" y="716" width="250" height="56" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="46" y="740" class="t" font-size="15">B · Bank / GCash transfer</text>
  <text x="46" y="760" class="s">Upload screenshot + ref no.</text>

  <rect x="30" y="782" width="250" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="46" y="806" class="t" font-size="15">C · Agreement only</text>
  <text x="46" y="826" class="s">"Trusted" customers only</text>
  <path class="ln" d="M155,615 L155,648"/>

  <!-- server: payment status -->
  <rect x="325" y="650" width="250" height="56" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="341" y="674" class="t" font-size="15">→ CONFIRMED</text>
  <text x="341" y="694" class="s">Payment provider pings server</text>
  <path class="ln" d="M280,678 L323,678"/>

  <rect x="325" y="716" width="250" height="56" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="341" y="740" class="t" font-size="15">→ PENDING_VERIFICATION</text>
  <text x="341" y="760" class="s">Waits for Nole</text>
  <path class="ln" d="M280,744 L323,744"/>

  <!-- owner verify -->
  <rect x="620" y="716" width="250" height="56" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="636" y="740" class="t" font-size="15">Check ref no. in app</text>
  <text x="636" y="760" class="s">Tap Verify → CONFIRMED</text>
  <path class="ln" d="M575,744 L618,744"/>
  <path class="dash" d="M745,716 L745,690 L577,690"/>

  <path class="ln" d="M280,810 L305,810 L305,885 L323,885"/>

  <!-- 7 save booking -->
  <rect x="325" y="870" width="250" height="78" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="349" cy="894" r="14" fill="#f59e0b"/><text x="349" y="899" text-anchor="middle" class="n">6</text>
  <text x="371" y="899" class="t">Save booking</text>
  <text x="341" y="925" class="s">Code 247-K3F9, price breakdown,</text>
  <text x="341" y="941" class="s">signed PDF, audit trail</text>
  <path class="ln" d="M575,678 L598,678 L598,850 L470,850 L470,868"/>

  <!-- 8 SMS -->
  <rect x="30" y="870" width="250" height="94" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="54" cy="894" r="14" fill="#3b82f6"/><text x="54" y="899" text-anchor="middle" class="n">7</text>
  <text x="76" y="899" class="t">Text reminders</text>
  <text x="46" y="925" class="s">Confirmed · 24 hrs · 2 hrs before</text>
  <text x="46" y="941" class="s">pickup · 2 hrs before return</text>
  <text x="46" y="957" class="s">Sender: 247RENTALS (registered)</text>
  <path class="ln" d="M325,930 L282,930"/>

  <!-- owner alert -->
  <rect x="620" y="870" width="250" height="78" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="636" y="899" class="t">Dashboard + alert</text>
  <text x="636" y="925" class="s">Shows in Today/Tomorrow;</text>
  <text x="636" y="941" class="s">SMS to Nole on new booking</text>
  <path class="ln" d="M575,909 L618,909"/>

  <!-- 9 pickup & balance -->
  <rect x="325" y="1000" width="250" height="94" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <circle cx="349" cy="1024" r="14" fill="#22c55e"/><text x="349" y="1029" text-anchor="middle" class="n">8</text>
  <text x="371" y="1029" class="t">Pickup + balance</text>
  <text x="341" y="1055" class="s">COD · GCash · Bank transfer</text>
  <text x="341" y="1071" class="s">Nole taps "collected" → ONGOING</text>
  <text x="341" y="1087" class="s">Return → COMPLETED</text>
  <path class="ln" d="M450,948 L450,998"/>

  <!-- rule box -->
  <rect x="620" y="1000" width="250" height="94" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="636" y="1026" class="t" fill="#991b1b">House rules</text>
  <text x="636" y="1050" class="s">• COD = balance only, never deposit</text>
  <text x="636" y="1068" class="s">• Match ref no. before verifying</text>
  <text x="636" y="1086" class="s">• Block dates for PMS / repair</text>

  <text x="450" y="1140" text-anchor="middle" class="lbl">Statuses: HELD → PENDING_VERIFICATION → CONFIRMED → ONGOING → COMPLETED · side exits: EXPIRED · CANCELLED · NO_SHOW</text>
</svg>
